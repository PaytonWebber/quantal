name: wheels

# Builds the platform wheels. Each wheel bundles prebuilt quantal libraries
# for the common embedding dimensions (python/build_libs.py); the package is
# ctypes-based, so one py3-none-<platform> wheel serves every Python 3.
#
# Zig cross-compiles to a pinned glibc, so the Linux wheel is manylinux-
# compatible without a manylinux Docker image — auditwheel just retags it.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-latest,  zig_target: "x86_64-linux-gnu.2.28",  repair: auditwheel }
          - { name: linux-aarch64,  os: ubuntu-24.04-arm, zig_target: "aarch64-linux-gnu.2.28", repair: auditwheel }
          - { name: macos-arm64,    os: macos-14,       zig_target: "",  repair: none }
          - { name: macos-x86_64,   os: macos-13,       zig_target: "",  repair: none }
          - { name: windows-x86_64, os: windows-latest, zig_target: "",  repair: none }
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build bundled libraries
        shell: bash
        run: |
          cd python
          if [ -n "${{ matrix.zig_target }}" ]; then
            python build_libs.py --target "${{ matrix.zig_target }}"
          else
            python build_libs.py
          fi

      - name: Build wheel
        shell: bash
        run: |
          python -m pip install --upgrade build
          cd python && python -m build --wheel

      - name: Repair Linux wheel (retag manylinux)
        if: matrix.repair == 'auditwheel'
        shell: bash
        run: |
          python -m pip install auditwheel
          # Zig pinned glibc to 2.28, so the binary already satisfies the
          # manylinux_2_28 policy; auditwheel just applies the tag.
          auditwheel repair --plat manylinux_2_28_${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }} \
            python/dist/*.whl -w wheelhouse
          rm -rf python/dist && mv wheelhouse python/dist

      - name: Smoke test (toolchain-free)
        shell: bash
        run: |
          python -m venv sv
          # venv python lives in bin/ on Unix, Scripts/ on Windows.
          VPY=sv/bin/python; [ -f sv/Scripts/python.exe ] && VPY=sv/Scripts/python.exe
          "$VPY" -m pip install numpy
          "$VPY" -m pip install --no-index --find-links python/dist quantal
          "$VPY" -c "import numpy as np; from quantal import Index; i=Index(dim=768); i.add(np.random.rand(100,768).astype('float32')); print('ok', len(i))"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: python/dist/*.whl

  # On a tag, collect all wheels and publish (configure PYPI token / trusted
  # publishing before enabling the upload step).
  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, pattern: wheels-*, merge-multiple: true }
      - run: ls -la dist
      # - uses: pypa/gh-action-pypi-publish@release/v1   # enable when ready
