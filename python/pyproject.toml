[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

# Distribution name "quantaldb"; the import package is "quantal".
[project]
name = "quantaldb"
version = "0.1.1"
description = "Embedded two-stage cascading vector index (1-bit graph routing + 3-bit TurboQuant + exact rerank)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
llama-index = ["llama-index-core>=0.12"]
langgraph = ["langgraph>=0.2"]

[tool.setuptools]
packages = ["quantal"]

[tool.setuptools.package-data]
# Prebuilt native libraries bundled into the platform wheel (built by
# build_libs.py before `python -m build`). Covers common embedding dims;
# uncommon dims fall back to build-on-demand at runtime.
quantal = ["_libs/*.so", "_libs/*.dylib", "_libs/*.dll"]
